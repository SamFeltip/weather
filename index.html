<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <meta name="description" content="Find out when it last snowed" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Figtree:ital,wght@0,300..900;1,300..900&family=Geist:wght@100..900&family=Unbounded:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <style>
      #current-weather {
        position: absolute;
        top: 16px;
        left: 16px;
        gap: 4px;
        display: flex;
        align-items: center;
        color: white;
        font-family: "Figtree";
        font-size: 20px;

        & svg {
          width: 54px;
          height: 54px;
          margin-bottom: 10px;
        }

        #current-temp {
          margin-bottom: 16px;
        }
      }

      .weather-wrapper {
        position: relative;
        height: 100%;
      }

      /* both stacked in same place */
      .last-weather,
      .next-weather {
        position: absolute;
        inset: 0;
        transition:
          opacity 0.2s ease,
          visibility 0.2s ease;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* visible states */
      .show-last-weather .last-weather {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .show-next-weather .next-weather {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      #rain-timeline {
        .graph {
          position: relative;
          /* width: 100%; */
          display: flex;
          justify-content: space-between;
          align-items: center;
          box-sizing: border-box;
        }

        .baseline {
          position: absolute;
          top: 50%;

          width: 100%;
          height: 1.2px;
          background: rgb(88, 155, 208);
          /* opacity: 0.4; */
          transform: translateY(-50%);
          border-radius: 5px;
          z-index: 1;
        }

        .hour-marker {
          position: absolute;
          left: calc(var(--hour-position) / 16 * 100%);
          width: 1.3px;
          border-radius: 5px;
          height: 40px;
          background: white;
          /* opacity: 0.4; */
          transform: translateX(-50%) translateY(-50%);
          z-index: 1;

          /* add a ball to the bottom of the hour market */
          &::before {
            content: "";
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
          }
        }

        .column {
          position: relative;
          width: 12px;
          margin-inline: 2px;
          height: 100%;
          display: flex;
          justify-content: center;
          border-radius: 5px;

          line-height: calc(var(--top-height) * 2 + 12px);
          font-size: 0.5rem;
          text-align: center;
          font-family: "Figtree";

          &::before {
            border-radius: 0px 0px 15px 15px;
          }

          &::after {
            border-radius: 15px 15px 0px 0px;
          }
        }

        /* Top bar */
        .column::after {
          content: "";
          color: white;
          position: absolute;
          bottom: 50%;
          width: 100%;
          height: var(--top-height, 0px);
          background: #bbdefb;
          transform-origin: bottom;
          transition: height 0.3s ease;
        }

        /* Bottom bar */
        .column::before {
          content: "";
          position: absolute;
          top: 50%;
          width: 100%;
          height: var(--bottom-height, 0px);
          background: #1e88e5;
          transform-origin: top;
          transition: height 0.3s ease;
        }

        .column:nth-child(3n)::after {
          content: attr(data-index);
        }
      }
    </style>
  </head>

    <script>
      //@ts-check

      // Clear skies
      const CLEAR = 0;
      const MAINLY_CLEAR = 1;

      // Partly cloudy / overcast
      const PARTLY_CLOUDY = 2;
      const OVERCAST = 3;

      // Rain / Showers
      const DRIZZLE_LIGHT = 51;
      const DRIZZLE_MODERATE = 53;
      const DRIZZLE_HEAVY = 55;
      const RAIN_LIGHT = 61;
      const RAIN_MODERATE = 63;
      const RAIN_HEAVY = 65;
      const SHOWERS_SLIGHT = 80;
      const SHOWERS_MODERATE = 81;
      const SHOWERS_VIOLENT = 82;

      // Snow / Snow Showers
      const SNOW_LIGHT = 71;
      const SNOW_MODERATE = 73;
      const SNOW_HEAVY = 75;
      const SNOW_GRAINS = 77;
      const SNOW_SHOWERS_SLIGHT = 85;
      const SNOW_SHOWERS_HEAVY = 86;

      const LATITUDE = 53.3676;
      const LONGITUDE = -1.5023;

      const MS_PER_DAY = 1000 * 60 * 60 * 24;

      const WEATHER_TIMEZONE = "Europe/London";
      const RECENT_HISTORY_DAYS = 60;
      const NEAR_FORECAST_DAYS = 16;
      const SEASONAL_FORECAST_DAYS = 210;
      const FORECAST_URL = "https://api.open-meteo.com/v1/forecast";
      const ARCHIVE_URL = "https://archive-api.open-meteo.com/v1/archive";
      const SEASONAL_URL = "https://seasonal-api.open-meteo.com/v1/forecast";

      const RAIN_THRESHOLD = 1; // in mm
      const SNOW_THRESHOLD = 0.1; // in cm
      const localDateTime = new Intl.DateTimeFormat("sv-SE", {
        timeZone: WEATHER_TIMEZONE,
        dateStyle: "short",
        timeStyle: "short",
      });
      const displayDate = new Intl.DateTimeFormat("en-GB", {
        timeZone: "UTC",
        dateStyle: "long",
      });
      const relativeDate = new Intl.RelativeTimeFormat("en-GB");

      /** @typedef {{ diff: number, date: string, seasonal?: boolean }} WeatherOccurrence */
      /** @typedef {{ last: WeatherOccurrence | null, next: WeatherOccurrence | null }} WeatherResult */

      /**
       * @typedef {{
       *   elemId: string,
       *   codes: number[]
       * }} WeatherTypeConfig
       */

      /**
       * @typedef {{
       *   time: string[],
       *   weather_code: number[],
       *   temperature_2m: number[],
       *   rain: number[],
       *   showers: number[],
       *   snowfall: number[],
       *   snow_depth: number[],
       *   cloud_cover_low: number[],
       *   cloud_cover_mid: number[],
       *   cloud_cover_high: number[]
       * }} HourlyData
       */

      /**
       * @typedef {{
       *   hourly: {time: string[], weather_code: (number | null)[], rain?: (number | null)[],
       *     showers?: (number | null)[], snowfall?: (number | null)[]},
       *   daily: {time: string[], rain_sum: (number | null)[],
       *     showers_sum?: (number | null)[], snowfall_sum: (number | null)[]}
       * }} WeatherRange
       */

      /** @typedef {{ rain: number, snow: number, codes: Set<number> }} Conditions */
      /** @typedef {keyof typeof weatherTypes} WeatherType */

      /** @type {{ rain: WeatherTypeConfig, snow: WeatherTypeConfig, sunshine: WeatherTypeConfig, clouds: WeatherTypeConfig }} */
      const weatherTypes = {
        rain: {
          elemId: "rain-weather",
          codes: [
            DRIZZLE_LIGHT,
            DRIZZLE_MODERATE,
            DRIZZLE_HEAVY,
            RAIN_LIGHT,
            RAIN_MODERATE,
            RAIN_HEAVY,
            SHOWERS_SLIGHT,
            SHOWERS_MODERATE,
            SHOWERS_VIOLENT,
            SNOW_SHOWERS_SLIGHT,
            SNOW_SHOWERS_HEAVY,
          ],
        },
        snow: {
          elemId: "snow-weather",
          codes: [
            SNOW_LIGHT,
            SNOW_MODERATE,
            SNOW_GRAINS,
            SNOW_HEAVY,
            SNOW_SHOWERS_SLIGHT,
            SNOW_SHOWERS_HEAVY,
          ],
        },
        sunshine: {
          elemId: "sun-weather",
          codes: [CLEAR, MAINLY_CLEAR],
        },
        clouds: {
          elemId: "cloud-weather",
          codes: [PARTLY_CLOUDY, OVERCAST],
        },
      };

      /**
       * @param {string} weatherType
       * @param {WeatherOccurrence | null} occurrence
       * @param {"last" | "next"} direction
       * @returns {string}
       */
      function describeOccurrence(weatherType, occurrence, direction) {
        if (!occurrence) return `no ${weatherType} date available`;

        const { diff } = occurrence;
        const past = direction === "last";
        if (diff === 0) return `${weatherType} ${past ? "earlier" : "later"} today`;
        if (diff === 1) return `${weatherType} ${past ? "yesterday" : "tomorrow"}`;
        if (diff === 7) return `${weatherType} ${past ? "last" : "next"} week`;

        const sign = past ? -1 : 1;
        if (diff < 7) return `${weatherType} ${relativeDate.format(sign * diff, "day")}`;
        if (diff < 30) return `${weatherType} ${relativeDate.format(sign * Math.floor(diff / 7), "week")}`;
        if (diff < 365) return `${weatherType} ${relativeDate.format(sign * Math.floor(diff / 30), "month")}`;
        return `${weatherType} ${relativeDate.format(sign * Math.floor(diff / 365), "year")}`;
      }

      /**
       * @param {string} elemId
       * @param {string} key
       * @param {WeatherResult} data
       * @returns {void}
       */
      function createCell(elemId, key, data) {
        const elem = document.getElementById(elemId);
        if (!elem) {
          console.warn(`[Weather] Element with ID '${elemId}' not found`);
          throw new Error(`Element with ID '${elemId}' not found`);
        }

        elem.innerHTML = `
            <span class="last-weather">
          ${
            data?.last
              ? `
          <h2 style="line-height:0.8;padding-block-start:1.2rem;margin:0;text-align:center;font-size:60px;font-weight:300;color:white;font-family: Bitcount Grid Double;">${data.last.diff}</h2>
              <p style="margin:0;margin-bottom:12px;font-family:Figtree;color:white;text-align:center;opacity: 0.65;"><time datetime="${data.last.date}" title="${displayDate.format(new Date(data.last.date))}">${describeOccurrence(key, data.last, "last")}</time></p>
              `
              : `
              <h2 style="margin:0;text-align:center;font-size:60px;font-weight:300;color:white;font-family: Bitcount Grid Double;">unknown</h2>
              `
          }
            </span>
            <span class="next-weather">
              <h2 style="line-height:0.8;padding-block-start:1.2rem;margin:0;text-align:center;font-size:60px;font-weight:300;color:white;font-family: Bitcount Grid Double;">${data?.next?.diff ?? "n/a"}</h2>
              <p style="margin:0;font-family:Figtree;color:white;text-align:center;opacity: 0.65;">${
                data.next
                  ? `<time datetime="${data.next.date}" title="${displayDate.format(new Date(data.next.date))}">${describeOccurrence(key, data.next, "next")}</time>`
                  : describeOccurrence(key, null, "next")
              }${data.next?.seasonal ? "<br>long-range estimate" : ""}</p>
            </span>

      `;
      }

      /**
       * @param {string} endpoint
       * @param {Record<string, string>} params
       * @returns {Promise<WeatherRange | null>}
       */
      async function fetchRange(endpoint, params) {
        const url = new URL(endpoint);
        url.search = new URLSearchParams({
          latitude: LATITUDE.toString(),
          longitude: LONGITUDE.toString(),
          timezone: WEATHER_TIMEZONE,
          hourly: "weather_code",
          daily: "rain_sum,showers_sum,snowfall_sum",
          ...params,
        }).toString();

        try {
          const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          /** @type {WeatherRange} */
          const data = await response.json();
          if (
            !data?.daily?.time?.length ||
            !Array.isArray(data.daily.rain_sum) ||
            !Array.isArray(data.daily.snowfall_sum) ||
            !Array.isArray(data.hourly?.time) ||
            !Array.isArray(data.hourly.weather_code)
          ) {
            throw new Error("Invalid weather range");
          }
          return data;
        } catch (error) {
          console.warn(`[Weather] Could not load ${url.hostname}`, error);
          return null;
        }
      }

      /**
       * @param {WeatherRange} data
       * @param {string} now
       * @param {"last" | "next"} direction
       * @returns {Map<string, Conditions>}
       */
      function getDailyConditions(data, now, direction) {
        const today = now.slice(0, 10);
        /** @type {Map<string, Conditions>} */
        const days = new Map();

        data.daily.time.forEach((date, index) => {
          days.set(date, {
            rain: date === today ? 0 :
              (data.daily.rain_sum[index] ?? 0) + (data.daily.showers_sum?.[index] ?? 0),
            snow: date === today ? 0 : (data.daily.snowfall_sum[index] ?? 0),
            codes: new Set(),
          });
        });

        data.hourly.time.forEach((hour, index) => {
          const date = hour.slice(0, 10);
          const day = days.get(date);
          if (!day) return;
          if (date === today) {
            if (direction === "last" ? hour > now : hour <= now) return;
            day.rain += (data.hourly.rain?.[index] ?? 0) + (data.hourly.showers?.[index] ?? 0);
            day.snow += data.hourly.snowfall?.[index] ?? 0;
          }
          const code = data.hourly.weather_code[index];
          if (code != null) day.codes.add(code);
        });

        return days;
      }

      /**
       * @param {WeatherType} key
       * @param {Conditions} day
       */
      function matchesWeather(key, day) {
        if (key === "rain") return day.rain >= RAIN_THRESHOLD;
        if (key === "snow") return day.snow >= SNOW_THRESHOLD;
        return weatherTypes[key].codes.some((code) => day.codes.has(code));
      }

      /**
       * @param {Map<string, Conditions>} days
       * @param {WeatherType} key
       * @param {string} today
       * @param {"last" | "next"} direction
       * @param {string} boundary
       * @returns {WeatherOccurrence | null}
       */
      function findOccurrence(days, key, today, direction, boundary) {
        let match = null;
        for (const [date, conditions] of days) {
          const inRange = direction === "last" ? date <= boundary : date >= boundary;
          if (!inRange || !matchesWeather(key, conditions)) continue;
          match = date;
          if (direction === "next") break;
        }
        if (!match) return null;
        return {
          date: match,
          diff: Math.abs(Date.parse(match) - Date.parse(today)) / MS_PER_DAY,
        };
      }

      /** @param {number} timestamp */
      function dateString(timestamp) {
        return new Date(timestamp).toISOString().slice(0, 10);
      }

      async function fetchWeather() {
        const now = localDateTime.format(new Date()).replace(" ", "T");
        const today = now.slice(0, 10);
        const todayTime = Date.parse(today);
        const previousYear = Number(today.slice(0, 4)) - 2;
        const twoYearsAgo = today.endsWith("-02-29")
          ? `${previousYear}-02-28`
          : `${previousYear}${today.slice(4)}`;
        /** @type {WeatherType[]} */
        const keys = /** @type {WeatherType[]} */ (Object.keys(weatherTypes));

        const recent = await fetchRange(FORECAST_URL, {
          hourly: "weather_code,rain,showers,snowfall",
          past_days: String(RECENT_HISTORY_DAYS),
          forecast_days: String(NEAR_FORECAST_DAYS),
        });
        const recentPast = recent ? getDailyConditions(recent, now, "last") : new Map();
        const nearFuture = recent ? getDailyConditions(recent, now, "next") : new Map();
        const results = keys.map((key) => ({
          key,
          last: findOccurrence(recentPast, key, today, "last", today),
          next: findOccurrence(nearFuture, key, today, "next", today),
        }));

        const archiveEnd = dateString(
          (recent ? Date.parse(recent.daily.time[0]) : todayTime) - MS_PER_DAY,
        );
        const seasonalStart = dateString(
          (recent ? Date.parse(recent.daily.time.at(-1) ?? today) : todayTime) + MS_PER_DAY,
        );
        const [archive, seasonal] = await Promise.all([
          results.some(({ last }) => !last)
            ? fetchRange(ARCHIVE_URL, {
                start_date: twoYearsAgo,
                end_date: archiveEnd,
                daily: "rain_sum,snowfall_sum",
              })
            : null,
          results.some(({ next }) => !next)
            ? fetchRange(SEASONAL_URL, {
                forecast_days: String(SEASONAL_FORECAST_DAYS),
                models: "ecmwf_seasonal_ensemble_mean_seamless",
              })
            : null,
        ]);

        const archivedDays = archive ? getDailyConditions(archive, now, "last") : new Map();
        const seasonalDays = seasonal ? getDailyConditions(seasonal, now, "next") : new Map();
        for (const result of results) {
          const { key } = result;
          result.last ??= findOccurrence(archivedDays, key, today, "last", archiveEnd);
          if (!result.next) {
            const estimate = findOccurrence(seasonalDays, key, today, "next", seasonalStart);
            if (estimate) result.next = { ...estimate, seasonal: true };
          }
          createCell(weatherTypes[key].elemId, key, result);
        }
      }

      /**
       * @returns {Promise<HourlyData>}
       */
      async function fetchCurrentWeather() {
        const hourly_params = [
          "temperature_2m",
          "weather_code",
          "rain",
          "showers",
          "snowfall",
          "snow_depth",
          "cloud_cover_low",
          "cloud_cover_mid",
          "cloud_cover_high",
        ];

        const params = new URLSearchParams({
          latitude: LATITUDE.toString(),
          longitude: LONGITUDE.toString(),
          hourly: hourly_params.join(","),
          forecast_days: "1",
        });

        const url = new URL(FORECAST_URL);
        url.search = params.toString();

        console.debug("[Weather] Fetching current weather:", url.toString());

        const res = await fetch(url);
        if (!res.ok) {
          console.error("Failed to fetch current weather:", res.statusText);
          throw new Error(`Failed to fetch current weather: ${res.statusText}`);
        }

        /** @type {{ hourly: HourlyData }} */
        const data = await res.json();

        if (
          !data ||
          !data.hourly ||
          !data.hourly.time ||
          !data.hourly.weather_code ||
          !data.hourly.temperature_2m
        ) {
          console.error("Invalid weather data format");
          throw new Error("Invalid weather data format");
        }

        return data.hourly;
      }

      const MAX_BAR_HEIGHT = 30; // in pixels

      /**
       * @param {number} index
       * @param {number} height as a %
       * @returns {void}
       */
      function setTopBar(index, height) {
        /** @type {HTMLElement?} */
        const column = document.querySelector(
          `#rain-timeline .column[data-index="${index}"]`,
        );
        if (!column) {
          return;
        }

        if (height === 0) {
          column.style.removeProperty("--top-height");
          return;
        }

        const heightPx = `${Math.max(2, Math.floor(MAX_BAR_HEIGHT * height))}px`;
        column.style.setProperty("--top-height", heightPx);
      }

      /**
       * @param {number} index
       * @param {number} height as a %
       * @returns {void}
       */
      function setBottomBar(index, height) {
        /** @type {HTMLElement?} */
        const column = document.querySelector(
          `#rain-timeline .column[data-index="${index}"]`,
        );
        if (!column) {
          return;
        }

        if (height === 0) {
          column.style.removeProperty("--bottom-height");
          return;
        }

        const heightPx = `${Math.max(Math.floor(MAX_BAR_HEIGHT * height), 2)}px`;
        column.style.setProperty("--bottom-height", heightPx);
      }

      fetchWeather().then(() => {
        const svgs = document.querySelectorAll("svg");

        /**
         * @returns {void}
         */
        function animateSVGs() {
          svgs.forEach((svg) => {
            svg.animate(
              [
                { transform: "scale(1)" },
                { transform: "scale(1.1)" },
                { transform: "scale(1)" },
              ],
              {
                duration: 200,
                easing: "ease-in-out",
              },
            );
          });

          if (document.body.classList.contains("show-last-weather")) {
            document.body.classList.remove("show-last-weather");
            document.body.classList.add("show-next-weather");
          } else if (document.body.classList.contains("show-next-weather")) {
            document.body.classList.remove("show-next-weather");
            document.body.classList.add("show-last-weather");
          } else {
            document.body.classList.add("show-last-weather");
          }
        }

        window.addEventListener("pointerdown", animateSVGs);
        window.addEventListener("keydown", animateSVGs);
      });

      const RAIN_TIMELINE_OFFSET = 6;

      fetchCurrentWeather().then((hourlyData) => {
        const currentHour = new Date().getHours();
        const currentWeatherCode = hourlyData.weather_code[currentHour];
        const currentTemperature = hourlyData.temperature_2m[currentHour];

        console.log(
          `Current weather code: ${currentWeatherCode}, temperature: ${currentTemperature}°C`,
        );

        console.log(
          `Current weather code: ${currentWeatherCode}, temperature: ${currentTemperature}°C`,
        );

        const weatherType = Object.keys(weatherTypes).find((key) =>
          weatherTypes[key].codes.includes(currentWeatherCode),
        );

        console.log(`Current weather type: ${weatherType}`);

        const currentWeatherElem = document.getElementById("current-weather");
        if (!currentWeatherElem) {
          console.warn("[Weather] Element with ID 'current-weather' not found");
          return;
        }

        const weatherSvg = document.querySelector(`svg#${weatherType}`);

        if (!weatherSvg) {
          console.warn(
            `[Weather] SVG element for weather type '${weatherType}' not found`,
          );
          return;
        }

        const currentWeatherSvg = currentWeatherElem.querySelector(
          "svg#current-weather-icon",
        );
        if (!currentWeatherSvg) {
          console.warn(
            "[Weather] No SVG found inside 'currentWeather' element",
          );
          return;
        }

        currentWeatherSvg.outerHTML = weatherSvg.outerHTML;

        const currentWeatherTemp = document.getElementById(
          "current-temp-content",
        );
        if (!currentWeatherTemp) {
          console.warn(
            "[Weather] Element with ID 'current-temp-content' not found",
          );
          return;
        }

        currentWeatherTemp.textContent = currentTemperature.toString();

        currentWeatherElem.style.display = "inherit";

        const rainTimeline = document.getElementById("rain-timeline");
        if (!rainTimeline) {
          console.warn("[Weather] Element with ID 'rain-timeline' not found");
          return;
        }

        const todayRainTimelineData = hourlyData.rain;
        /** @type {NodeListOf<HTMLElement>} */
        const columns = rainTimeline.querySelectorAll(".column");
        const maxRain = Math.max(
          0,
          ...Array.from(columns, (column) =>
            todayRainTimelineData[Number(column.dataset.index)] ?? 0,
          ),
        );
        if (maxRain === 0) return;

        rainTimeline.style.removeProperty("display");

        console.log(`Setting current hour position to ${currentHour}`);

        const currentHourPosition = Math.max(
          Math.min(currentHour - RAIN_TIMELINE_OFFSET, 16),
          0,
        ); // since our timeline starts at 6am

        rainTimeline.style.setProperty(
          "--hour-position",
          currentHourPosition.toString(),
        );

        const HEAVY_RAIN_THRESHOLD = 2;

        const heaviness_offset = Math.min(1, maxRain / HEAVY_RAIN_THRESHOLD);

        console.debug("Max rain value for today:", maxRain);

        columns.forEach((column) => {
          const index = Number(column.dataset.index);
          if (index < currentHourPosition + RAIN_TIMELINE_OFFSET) {
            column.style.opacity = "0.5";
          }
          const rain = todayRainTimelineData[index] ?? 0;
          setBottomBar(index, Math.min((rain / maxRain) * heaviness_offset, 1));
        });

        const todayCloudTimelineData = hourlyData.cloud_cover_low.map(
          (low, index) =>
            Math.max(
              low,
              hourlyData.cloud_cover_mid[index],
              hourlyData.cloud_cover_high[index],
            ),
        );

        console.debug("Today's cloud timeline data:", todayCloudTimelineData);

        const noClouds = todayCloudTimelineData.every((cloud) => cloud === 0);

        if (noClouds) {
          console.log("No clouds expected today");
          return;
        }

        todayCloudTimelineData.forEach((cloud, index) => {
          setTopBar(index, cloud / 100);
        });
      });
    </script>
  </body>
</html>
